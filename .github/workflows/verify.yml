name: verify

# Pull requests and main build, test and pack the package; a v*.*.* tag also publishes it to
# npmjs and creates the GitHub release. The tag must match the package.json version.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions: {}

jobs:
  package:
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/npm-package.yml@v0
    with:
      node-version: '22'
      # build last: npm pack runs prepack, not prepublishOnly, so dist/ is built here.
      scripts: typecheck lint test build
      access: public
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  powershell:
    permissions:
      contents: read
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pwsh-ci.yml@v0
    with:
      os: '["windows-latest"]'
      paths: tools
      tests: tools
